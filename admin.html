<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;

      color: white;

      padding: 30px;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(124,58,237,.35),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(6,182,212,.25),
          transparent 30%
        ),
        #070713;
    }

    .dashboard {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 30px;
    }

    .title-small {
      color: #a78bfa;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 1.5px;

      margin-bottom: 8px;
    }

    h1 {
      margin: 0;

      font-size: 36px;

      letter-spacing: -1.5px;
    }

    .refresh {
      border: 0;

      color: white;

      padding: 13px 20px;

      border-radius: 13px;

      font-weight: 700;

      cursor: pointer;

      background:
        linear-gradient(
          110deg,
          #7c3aed,
          #06b6d4
        );

      box-shadow:
        0 10px 25px rgba(124,58,237,.25);
    }

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;

      margin-bottom: 25px;
    }

    .stat {
      padding: 20px;

      border-radius: 18px;

      background: rgba(255,255,255,.06);

      border:
        1px solid
        rgba(255,255,255,.1);
    }

    .stat-label {
      color: #88899d;

      font-size: 11px;

      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;

      font-weight: 800;
    }

    .submission {
      padding: 22px;

      margin-bottom: 15px;

      border-radius: 20px;

      background:
        rgba(255,255,255,.065);

      border:
        1px solid
        rgba(255,255,255,.1);

      backdrop-filter: blur(20px);

      box-shadow:
        0 15px 40px rgba(0,0,0,.2);
    }

    .submission-top {
      display: flex;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 17px;
    }

    .submission-id {
      color: #c4b5fd;

      font-weight: 800;

      font-size: 13px;
    }

    .date {
      color: #707185;

      font-size: 11px;
    }

    .sections {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 15px;
    }

    .section {
      padding: 17px;

      border-radius: 15px;

      background:
        rgba(0,0,0,.2);
    }

    .label {
      color: #8b5cf6;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 1px;

      margin-bottom: 8px;
    }

    .value {
      color: #e5e7eb;

      font-size: 14px;

      line-height: 1.5;

      word-break: break-word;
    }

    .empty {
      padding: 60px;

      text-align: center;

      color: #77788c;

      border-radius: 20px;

      background:
        rgba(255,255,255,.05);
    }

    .error {
      color: #fca5a5;

      padding: 25px;

      text-align: center;
    }

    @media(max-width: 700px) {

      body {
        padding: 16px;
      }

      .top {
        align-items: flex-start;

        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .sections {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

  <main class="dashboard">

    <div class="top">

      <div>
        <div class="title-small">
          CONTROL CENTER
        </div>

        <h1>Admin Dashboard</h1>
      </div>

      <button
        class="refresh"
        onclick="loadSubmissions()"
      >
        ↻ Refresh
      </button>

    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">
          TOTAL SUBMISSIONS
        </div>

        <div
          class="stat-value"
          id="total"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          STATUS
        </div>

        <div
          class="stat-value"
          style="color:#86efac"
        >
          LIVE
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          DATABASE
        </div>

        <div class="stat-value">
          Google Sheets
        </div>
      </div>

    </div>

    <div id="list">
      Loading submissions...
    </div>

  </main>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxA7Ge4T2bx_IBQLG56_Hp-WX47Yy2YSD7dEC2UQXcPnGmOX6MTMHIV_Z6MU-Zgat2-/exec";

    async function loadSubmissions() {

      const list =
        document.getElementById("list");

      try {

        const response =
          await fetch(API_URL);

        if (!response.ok) {
          throw new Error(
            "Failed to load"
          );
        }

        const data =
          await response.json();

        document.getElementById("total")
          .textContent = data.length;

        if (data.length === 0) {

          list.innerHTML = `
            <div class="empty">
              No submissions yet.
            </div>
          `;

          return;
        }

        list.innerHTML =
          data.map(item => `

            <div class="submission">

              <div class="submission-top">

                <div class="submission-id">
                  SUBMISSION #${escapeHtml(item.id)}
                </div>

                <div class="date">
                  ${formatDate(item.created_at)}
                </div>

              </div>

              <div class="sections">

                <div class="section">

                  <div class="label">
                    SECTION 1
                  </div>

                  <div class="value">
                    ${escapeHtml(item.section1)}
                  </div>

                </div>

                <div class="section">

                  <div class="label">
                    SECTION 2
                  </div>

                  <div class="value">
                    ${escapeHtml(item.section2)}
                  </div>

                </div>

              </div>

            </div>

          `).join("");

      } catch (error) {

        console.error(error);

        list.innerHTML = `
          <div class="error">
            Unable to load submissions.
          </div>
        `;

      }

    }

    function formatDate(date) {

      if (!date) return "";

      const d = new Date(date);

      if (isNaN(d.getTime())) {
        return String(date);
      }

      return d.toLocaleString();

    }

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }

    loadSubmissions();

  </script>

</body>
</html>
