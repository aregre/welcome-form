<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
      background:
        radial-gradient(circle at 15% 20%, rgba(124,58,237,.45), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(6,182,212,.35), transparent 30%),
        linear-gradient(135deg, #050510, #0d0d21, #06151c);
    }

    .card {
      width: 100%;
      max-width: 530px;
      padding: 42px;
      border-radius: 30px;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.13);
      backdrop-filter: blur(25px);
      box-shadow: 0 35px 100px rgba(0,0,0,.55);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 50px;
      color: #c4b5fd;
      background: rgba(124,58,237,.15);
      border: 1px solid rgba(167,139,250,.25);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 58px;
      letter-spacing: -3px;
      margin-bottom: 15px;
      background: linear-gradient(100deg,#fff,#c4b5fd,#67e8f9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #aaaabd;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #dedeee;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .input-box {
      position: relative;
    }

    .number {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 31px;
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: linear-gradient(135deg,#7c3aed,#06b6d4);
      font-size: 10px;
      font-weight: 900;
    }

    input {
      width: 100%;
      height: 60px;
      padding: 0 18px 0 58px;
      border-radius: 17px;
      border: 1px solid rgba(255,255,255,.11);
      outline: none;
      background: rgba(0,0,0,.22);
      color: white;
      font-size: 14px;
    }

    input::placeholder {
      color: #68697c;
    }

    input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139,92,246,.1);
    }

    button {
      width: 100%;
      height: 60px;
      border: 0;
      border-radius: 17px;
      color: white;
      background: linear-gradient(110deg,#6d28d9,#8b5cf6,#06b6d4);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
      box-shadow: 0 15px 35px rgba(124,58,237,.32);
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 13px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .success {
      display: block;
      color: #86efac;
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.2);
    }

    .error {
      display: block;
      color: #fca5a5;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.2);
    }

    .footer {
      text-align: center;
      color: #626378;
      font-size: 10px;
      margin-top: 25px;
    }

    @media(max-width:560px) {
      .card {
        padding: 30px 21px;
      }

      h1 {
        font-size: 46px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="badge">
      WELCOME • GET STARTED
    </div>

    <h1>Welcome</h1>

    <p class="subtitle">
      Enter your information below and continue when you're ready.
    </p>

    <form id="myForm">

      <div class="field">
        <label for="section1">User Name</label>

        <div class="input-box">
          <span class="number">01</span>

          <input
            id="section1"
            type="text"
            placeholder="Enter your name..."
            autocomplete="off"
            required
          >
        </div>
      </div>

      <div class="field">
        <label for="section2">Section 2</label>

        <div class="input-box">
          <span class="number">02</span>

          <input
            id="section2"
            type="text"
            placeholder="Enter information..."
            autocomplete="off"
            required
          >
        </div>
      </div>

      <button id="submitBtn" type="submit">
        Continue →
      </button>

      <div id="status" class="status"></div>

    </form>

    <div class="footer">
      SECURE • SIMPLE • MODERN
    </div>

  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxA7Ge4T2bx_IBQLG56_Hp-WX47Yy2YSD7dEC2UQXcPnGmOX6MTMHIV_Z6MU-Zgat2-/exec";

    const form = document.getElementById("myForm");
    const button = document.getElementById("submitBtn");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const section1 =
        document.getElementById("section1").value.trim();

      const section2 =
        document.getElementById("section2").value.trim();

      if (!section1 || !section2) {
        showMessage(
          "Please fill both sections.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Submitting...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            section1: section1,
            section2: section2
          })
        });

        const result = await response.json();

        if (!result.success) {
          throw new Error(
            result.message || "Submission failed"
          );
        }

        showMessage(
          "✓ Submitted successfully!",
          "success"
        );

        form.reset();

      } catch (error) {
        console.error(error);

        showMessage(
          "❌ Submission failed. Please try again.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Continue →";
      }
    });

    function showMessage(message, type) {
      status.textContent = message;
      status.className = "status " + type;
    }
  </script>

</body>
</html>
