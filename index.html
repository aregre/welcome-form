<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MIKEY • SECTION ACCESS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;

      color: #fff;

      background:
        radial-gradient(circle at 20% 20%, rgba(255, 0, 60, .20), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(100, 0, 255, .20), transparent 30%),
        #050509;
    }

    /* Animated background */
    body::before {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: rgba(255, 0, 55, .10);
      filter: blur(80px);
      animation: moveGlow 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes moveGlow {
      0% {
        transform: translate(-250px, -180px);
      }

      100% {
        transform: translate(250px, 180px);
      }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #ff174f;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff174f;
      animation: float 7s linear infinite;
      opacity: .7;
    }

    .particle:nth-child(1) {
      left: 10%;
      bottom: -20px;
      animation-delay: 0s;
    }

    .particle:nth-child(2) {
      left: 25%;
      bottom: -20px;
      animation-delay: 2s;
    }

    .particle:nth-child(3) {
      left: 45%;
      bottom: -20px;
      animation-delay: 4s;
    }

    .particle:nth-child(4) {
      left: 65%;
      bottom: -20px;
      animation-delay: 1s;
    }

    .particle:nth-child(5) {
      left: 85%;
      bottom: -20px;
      animation-delay: 3s;
    }

    @keyframes float {
      0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
      }

      20% {
        opacity: .8;
      }

      100% {
        transform: translateY(-110vh) scale(1.3);
        opacity: 0;
      }
    }

    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 390px;
    }

    .card {
      position: relative;
      padding: 38px 32px;
      text-align: center;

      background: rgba(12, 12, 18, .88);
      border: 1px solid rgba(255, 23, 79, .35);
      border-radius: 18px;

      box-shadow:
        0 0 35px rgba(255, 0, 60, .12),
        inset 0 0 30px rgba(255, 255, 255, .02);

      backdrop-filter: blur(15px);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 2px;

      background: linear-gradient(
        90deg,
        transparent,
        #ff174f,
        transparent
      );

      box-shadow: 0 0 15px #ff174f;
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: #fff;
      font-size: 30px;
      font-weight: 900;

      background: linear-gradient(
        135deg,
        #ff174f,
        #8b001f
      );

      border: 2px solid rgba(255,255,255,.2);

      box-shadow:
        0 0 20px rgba(255, 23, 79, .5),
        inset 0 0 15px rgba(0,0,0,.5);

      animation: logoPulse 2.5s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(255,23,79,.4);
      }

      50% {
        transform: scale(1.06);
        box-shadow: 0 0 35px rgba(255,23,79,.75);
      }
    }

    .brand {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 8px;

      color: #fff;

      text-shadow:
        0 0 8px rgba(255,255,255,.25),
        0 0 20px rgba(255,23,79,.35);
    }

    .subtitle {
      color: #aaa;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 11px;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;

      border: 1px solid #292934;
      border-radius: 9px;

      background: #09090e;
      color: #fff;

      outline: none;
      font-size: 13px;

      transition: .25s ease;
    }

    input:hover {
      border-color: #444451;
    }

    input:focus {
      border-color: #ff174f;

      box-shadow:
        0 0 0 2px rgba(255,23,79,.10),
        0 0 18px rgba(255,23,79,.15);
    }

    input::placeholder {
      color: #777;
    }

    button {
      width: 100%;
      height: 48px;
      margin-top: 8px;

      border: 0;
      border-radius: 9px;

      color: #fff;

      background: linear-gradient(
        135deg,
        #ff174f,
        #b0002a
      );

      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(255, 23, 79, .20);

      transition: .25s ease;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 28px rgba(255,23,79,.35);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 24px 0;

      color: #555;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #282832;
    }

    .secure {
      color: #777;
      font-size: 11px;
    }

    .secure span {
      color: #ff4167;
    }

    .status {
      display: none;
      margin-top: 14px;
      padding: 11px;

      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .success {
      display: block;
      color: #75ffb0;
      background: rgba(20, 160, 80, .12);
      border: 1px solid rgba(50, 220, 120, .2);
    }

    .error {
      display: block;
      color: #ff718c;
      background: rgba(220, 30, 60, .12);
      border: 1px solid rgba(255, 50, 80, .2);
    }

    .bottom-card {
      margin-top: 12px;
      padding: 17px;

      background: rgba(12,12,18,.75);
      border: 1px solid #20202a;
      border-radius: 12px;

      text-align: center;
      font-size: 12px;
      color: #777;
    }

    .bottom-card strong {
      color: #ff4167;
    }

    .footer {
      text-align: center;
      color: #444;
      font-size: 10px;
      margin-top: 20px;
      letter-spacing: 1px;
    }

    @media(max-width:420px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 32px 23px;
      }

      .brand {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- Animated particles -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="page">

    <div class="card">

      <div class="logo">M</div>

      <div class="brand">
        MIKEY
      </div>

      <p class="subtitle">
        Enter your section information<br>
        to continue.
      </p>

      <form id="myForm">

        <div class="field">
          <input
            id="section1"
            type="text"
            placeholder="Section Number 1"
            autocomplete="off"
            required
          >
        </div>

        <div class="field">
          <input
            id="section2"
            type="text"
            placeholder="Section Number 2"
            autocomplete="off"
            required
          >
        </div>

        <button id="submitBtn" type="submit">
          CONTINUE
        </button>

        <div id="status" class="status"></div>

      </form>

      <div class="divider">
        TOKYO
      </div>

      <div class="secure">
        <span>◆</span> DARK • MODERN • ANIMATED
      </div>

    </div>

    <div class="bottom-card">
      Welcome to the section.
      <strong>Get Started</strong>
    </div>

    <div class="footer">
      © 2026 • MIKEY THEME
    </div>

  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx61bgHjlTKC_wVHqB4xjiHY1LqlEfhkfuXbTENC9sWjgbM52y-JwFaumhkdOW7f8_i/exec";

    const form =
      document.getElementById("myForm");

    const button =
      document.getElementById("submitBtn");

    const status =
      document.getElementById("status");


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const section1 =
          document
            .getElementById("section1")
            .value
            .trim();

        const section2 =
          document
            .getElementById("section2")
            .value
            .trim();


        if (!section1 || !section2) {

          showMessage(
            "Please fill both sections.",
            "error"
          );

          return;
        }


        button.disabled = true;
        button.textContent = "SUBMITTING...";


        try {

          const response = await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({
                section1: section1,
                section2: section2
              })
            }
          );


          const result =
            await response.json();


          if (
            !response.ok ||
            !result.success
          ) {

            throw new Error(
              result.message ||
              "Submission failed"
            );

          }


          showMessage(
            "✓ Submission successful!",
            "success"
          );


          form.reset();


        } catch (error) {

          console.error(error);

          showMessage(
            "❌ Submission failed. Please try again.",
            "error"
          );

        } finally {

          button.disabled = false;
          button.textContent = "CONTINUE";

        }

      }
    );


    function showMessage(message, type) {

      status.textContent = message;

      status.className =
        "status " + type;

    }

  </script>

</body>
</html>
