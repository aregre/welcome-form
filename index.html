<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MIKEY • SECTION ACCESS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at 50% 40%,
          rgba(100, 10, 30, 0.28),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #030305,
          #0d0509,
          #030305
        );

      color: white;
    }

    /* Background glow */

    .glow {
      position: fixed;
      width: 450px;
      height: 450px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      background: rgba(255, 0, 55, 0.12);

      filter: blur(100px);

      animation: glowMove 6s ease-in-out infinite alternate;

      pointer-events: none;
    }

    @keyframes glowMove {
      0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0.5;
      }

      100% {
        transform: translate(-50%, -50%) scale(1.25);
        opacity: 1;
      }
    }

    /* Floating particles */

    .particles {
      position: fixed;
      inset: 0;

      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #ff174f;

      box-shadow:
        0 0 8px #ff174f,
        0 0 15px #ff174f;

      animation: particleMove 8s linear infinite;

      opacity: 0;
    }

    .particle:nth-child(1) {
      left: 8%;
      animation-delay: 0s;
    }

    .particle:nth-child(2) {
      left: 22%;
      animation-delay: 2s;
    }

    .particle:nth-child(3) {
      left: 42%;
      animation-delay: 4s;
    }

    .particle:nth-child(4) {
      left: 67%;
      animation-delay: 1s;
    }

    .particle:nth-child(5) {
      left: 88%;
      animation-delay: 3s;
    }

    @keyframes particleMove {
      0% {
        bottom: -10px;
        opacity: 0;
        transform: scale(0.5);
      }

      15% {
        opacity: 0.8;
      }

      85% {
        opacity: 0.5;
      }

      100% {
        bottom: 110%;
        opacity: 0;
        transform: scale(1.4);
      }
    }

    /* Main scene */

    .scene {
      position: relative;

      width: min(1000px, 100vw);
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      z-index: 2;
    }

    /* Video */

    .mikey-video {
      position: absolute;

      left: 50%;
      bottom: 0;

      transform: translateX(-50%);

      width: min(650px, 90vw);
      height: 92vh;

      object-fit: contain;

      border: none;
      outline: none;

      filter:
        drop-shadow(0 0 20px rgba(255, 20, 70, 0.18))
        drop-shadow(0 0 50px rgba(255, 0, 40, 0.08));

      animation: characterFloat 4s ease-in-out infinite;

      z-index: 2;
    }

    @keyframes characterFloat {
      0%,
      100% {
        transform: translateX(-50%) translateY(0);
      }

      50% {
        transform: translateX(-50%) translateY(-7px);
      }
    }

    /* Dark overlay around edges */

    .scene::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.35),
          transparent 25%,
          transparent 70%,
          rgba(0,0,0,0.5)
        );

      z-index: 3;
    }

    /* Section boxes */

    .section-box {
      position: absolute;

      width: 210px;

      padding: 9px;

      background: rgba(7, 7, 12, 0.82);

      border: 1px solid rgba(255, 23, 79, 0.65);

      border-radius: 12px;

      backdrop-filter: blur(12px);

      box-shadow:
        0 0 20px rgba(255, 23, 79, 0.18),
        inset 0 0 15px rgba(255, 23, 79, 0.04);

      z-index: 5;

      animation: boxFloat 3s ease-in-out infinite;
    }

    /* Left shoulder */

    .left-section {
      left: calc(50% - 435px);
      bottom: 27%;
    }

    /* Right shoulder */

    .right-section {
      right: calc(50% - 435px);
      bottom: 27%;

      animation-delay: 0.5s;
    }

    @keyframes boxFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    /* Input */

    .section-box input {
      width: 100%;
      height: 46px;

      padding: 0 13px;

      border: 1px solid #292933;

      border-radius: 8px;

      outline: none;

      background: #0b0b11;

      color: white;

      font-size: 12px;

      transition: 0.25s ease;
    }

    .section-box input::placeholder {
      color: #777;
    }

    .section-box input:hover {
      border-color: #555563;
    }

    .section-box input:focus {
      border-color: #ff174f;

      box-shadow:
        0 0 0 2px rgba(255, 23, 79, 0.08),
        0 0 18px rgba(255, 23, 79, 0.25);
    }

    /* Continue button */

    .continue-area {
      position: absolute;

      left: 50%;
      bottom: 7%;

      transform: translateX(-50%);

      width: 210px;

      z-index: 6;

      text-align: center;
    }

    button {
      width: 100%;
      height: 45px;

      border: none;
      border-radius: 9px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #ff174f,
          #a50029
        );

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(255, 23, 79, 0.25);

      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(255, 23, 79, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    /* Status */

    .status {
      display: none;

      margin-top: 10px;
      padding: 9px;

      border-radius: 8px;

      font-size: 11px;
      font-weight: 600;

      background: rgba(10,10,15,0.9);
    }

    .success {
      display: block;

      color: #72ffad;

      border: 1px solid rgba(50, 220, 120, 0.25);
    }

    .error {
      display: block;

      color: #ff6d88;

      border: 1px solid rgba(255, 50, 80, 0.25);
    }

    /* Title */

    .title {
      position: absolute;

      top: 5%;

      left: 50%;

      transform: translateX(-50%);

      z-index: 6;

      text-align: center;

      letter-spacing: 5px;

      font-size: 25px;

      font-weight: 900;

      color: white;

      text-shadow:
        0 0 10px rgba(255,255,255,0.2),
        0 0 25px rgba(255,23,79,0.35);

      white-space: nowrap;
    }

    .subtitle {
      margin-top: 7px;

      color: #777;

      font-size: 10px;

      letter-spacing: 2px;
    }

    /* Footer */

    .footer {
      position: fixed;

      bottom: 12px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 10;

      color: #444;

      font-size: 9px;

      letter-spacing: 1px;

      white-space: nowrap;
    }

    /* Mobile */

    @media (max-width: 850px) {

      .mikey-video {
        width: 100vw;
        height: 82vh;
      }

      .left-section {
        left: 2%;
        bottom: 25%;
      }

      .right-section {
        right: 2%;
        bottom: 25%;
      }

      .section-box {
        width: 165px;
      }
    }

    @media (max-width: 600px) {

      .title {
        top: 4%;

        font-size: 19px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 8px;
      }

      .mikey-video {
        width: 115vw;
        height: 76vh;
      }

      .section-box {
        width: 145px;
        padding: 7px;
      }

      .section-box input {
        height: 42px;
        font-size: 11px;
      }

      .left-section {
        left: 1%;
        bottom: 23%;
      }

      .right-section {
        right: 1%;
        bottom: 23%;
      }

      .continue-area {
        width: 180px;
        bottom: 8%;
      }
    }

    @media (max-width: 420px) {

      .section-box {
        width: 130px;
      }

      .section-box input {
        height: 40px;
        padding: 0 9px;
        font-size: 10px;
      }

      .left-section {
        left: 2px;
      }

      .right-section {
        right: 2px;
      }

      .mikey-video {
        width: 125vw;
      }

      .continue-area {
        width: 165px;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>


  <div class="scene">

    <!-- Your video -->
    <video
      class="mikey-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    >
      <source src="mikey.mp4" type="video/mp4">
      Your browser does not support video.
    </video>


    <div class="title">
      MIKEY
      <div class="subtitle">
        SECTION ACCESS
      </div>
    </div>


    <!-- Left shoulder section -->

    <div class="section-box left-section">

      <input
        id="section1"
        type="text"
        placeholder="Section Number 1"
        autocomplete="off"
        required
      >

    </div>


    <!-- Right shoulder section -->

    <div class="section-box right-section">

      <input
        id="section2"
        type="text"
        placeholder="Section Number 2"
        autocomplete="off"
        required
      >

    </div>


    <!-- Continue -->

    <div class="continue-area">

      <form id="myForm">

        <button
          id="submitBtn"
          type="submit"
        >
          CONTINUE
        </button>

        <div
          id="status"
          class="status"
        ></div>

      </form>

    </div>

  </div>


  <div class="footer">
    © 2026 • DARK SECTION
  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx61bgHjlTKC_wVHqB4xjiHY1LqlEfhkfuXbTENC9sWjgbM52y-JwFaumhkdOW7f8_i/exec";


    const form =
      document.getElementById("myForm");

    const button =
      document.getElementById("submitBtn");

    const status =
      document.getElementById("status");


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const section1 =
          document
            .getElementById("section1")
            .value
            .trim();


        const section2 =
          document
            .getElementById("section2")
            .value
            .trim();


        if (!section1 || !section2) {

          showMessage(
            "Please fill both sections.",
            "error"
          );

          return;
        }


        button.disabled = true;

        button.textContent =
          "SUBMITTING...";


        try {

          const response =
            await fetch(
              API_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body: JSON.stringify({
                  section1: section1,
                  section2: section2
                })
              }
            );


          const result =
            await response.json();


          if (
            !response.ok ||
            !result.success
          ) {

            throw new Error(
              result.message ||
              "Submission failed"
            );

          }


          showMessage(
            "✓ Submission successful!",
            "success"
          );


          form.reset();


        } catch (error) {

          console.error(error);


          showMessage(
            "❌ Submission failed. Please try again.",
            "error"
          );


        } finally {

          button.disabled = false;

          button.textContent =
            "CONTINUE";

        }

      }
    );


    function showMessage(
      message,
      type
    ) {

      status.textContent =
        message;

      status.className =
        "status " + type;

    }

  </script>

</body>
</html>
